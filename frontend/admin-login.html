<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Digital Health HDC</title>

    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons: Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #E3F2FD 0%, #FFFFFF 100%);
        }

        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            /* More pronounced shadow */
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #F1F5F9;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header img {
            height: 80px;
            margin-bottom: 16px;
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-light);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 14px;
            color: var(--text-heading);
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 20px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            /* Left padding for icon */
            font-size: 15px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            color: var(--text-heading);
            transition: all 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(64, 196, 255, 0.2);
        }

        .form-input::placeholder {
            color: #CBD5E1;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-main);
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--primary-blue);
            width: 16px;
            height: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #40C4FF 0%, #2CD3E1 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(64, 196, 255, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(64, 196, 255, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <img src="assets/logo_digital_health.png" alt="Logo">
            <h2>Admin Login</h2>
            <p>เข้าสู่ระบบจัดการข้อมูล 43 แฟ้ม</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <i class="ph ph-user"></i>
                    <input type="text" id="username" class="form-input" placeholder="Enter your username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <i class="ph ph-lock-key"></i>
                    <input type="password" id="password" class="form-input" placeholder="Enter your password" required>
                </div>
            </div>

            <div class="form-actions">
                <label class="remember-me">
                    <input type="checkbox">
                    Remember me
                </label>
                <!-- Optional: Forgot Password Link -->
                <!-- <a href="#" style="font-size: 14px; color: var(--primary-blue); text-decoration: none;">Forgot Password?</a> -->
            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>
        </form>
    </div>

    <script type="module" src="admin-login-script.ts"></script>
</body>

</html>
